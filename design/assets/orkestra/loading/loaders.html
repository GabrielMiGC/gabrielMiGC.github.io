<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orkestra · Loading States</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:     #0A0B0A;
    --panel:  #141614;
    --panel2: #1b1e1b;
    --line:   rgba(244,245,242,0.09);
    --lime:   #C7F807;
    --violet: #8B5CF6;
    --ink:    #F4F5F2;
    --mut:    #6C716B;
    --disp: "Space Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--disp);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: 56px 40px 72px;
  }

  /* ── page header (chrome, not on the indicators) ───────────────── */
  header {
    max-width: 1160px;
    margin: 0 auto 44px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .wordmark {
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .wordmark .dot { color: var(--lime); }
  .caption {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--mut);
  }

  /* ── grid of 200×200 tiles ─────────────────────────────────────── */
  .grid {
    max-width: 1160px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, 200px);
    gap: 18px;
    justify-content: center;
  }
  .tile {
    width: 200px;
    height: 200px;
    background:
      radial-gradient(120% 120% at 50% 0%, var(--panel2), var(--panel) 70%);
    border: 1px solid var(--line);
    border-radius: 18px;
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
  }
  /* the 120×120 working area each loader lives in */
  .stage {
    width: 120px;
    height: 120px;
    position: relative;
    display: grid;
    place-items: center;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
  }

  /* ════════════════════════════════════════════════════════════════
     01 · EQUALIZER — bars bouncing
  ════════════════════════════════════════════════════════════════ */
  .eq { display: flex; align-items: flex-end; gap: 9px; height: 86px; }
  .eq i {
    width: 11px; height: 100%; border-radius: 5px;
    background: var(--lime); transform-origin: bottom center;
    animation: eq 1.05s ease-in-out infinite;
  }
  .eq i:nth-child(1) { animation-delay: -.20s; }
  .eq i:nth-child(2) { animation-delay: -.55s; }
  .eq i:nth-child(3) { animation-delay: -.85s; }
  .eq i:nth-child(4) { animation-delay: -.35s; }
  .eq i:nth-child(5) { animation-delay: -.70s; }
  @keyframes eq { 0%,100% { transform: scaleY(.22); } 50% { transform: scaleY(1); } }

  /* ════════════════════════════════════════════════════════════════
     02 · CURTAINS — velvet panels part & close
  ════════════════════════════════════════════════════════════════ */
  .curtain { position: relative; width: 122px; height: 132px; border-radius: 5px 5px 2px 2px; overflow: hidden; background: #060706; }
  .curtain .rod { position: absolute; top: 0; left: -4px; right: -4px; height: 7px; background: var(--lime); border-radius: 4px; z-index: 4; }
  .curtain .glow { position: absolute; top: 7px; left: 50%; transform: translateX(-50%); width: 30px; height: calc(100% - 7px);
    background: radial-gradient(closest-side, rgba(199,248,7,.18), transparent 75%); }
  .curtain .panel { position: absolute; top: 7px; bottom: 0; width: 54%; }
  .curtain .left  { left: 0;  border-radius: 0 0 0 3px;
    background: repeating-linear-gradient(90deg, #7a4fe0 0, #5b34b8 7px, #7a4fe0 14px);
    animation: curtL 3s ease-in-out infinite; }
  .curtain .right { right: 0; border-radius: 0 0 3px 0;
    background: repeating-linear-gradient(90deg, #7a4fe0 0, #5b34b8 7px, #7a4fe0 14px);
    animation: curtR 3s ease-in-out infinite; }
  @keyframes curtL { 0%,16% { transform: translateX(0); } 50%,66% { transform: translateX(-98%); } 100% { transform: translateX(0); } }
  @keyframes curtR { 0%,16% { transform: translateX(0); } 50%,66% { transform: translateX(98%);  } 100% { transform: translateX(0); } }

  /* ════════════════════════════════════════════════════════════════
     03 · METRONOME — pendulum swing
  ════════════════════════════════════════════════════════════════ */
  .metro { position: relative; width: 110px; height: 100px; }
  .metro .arm {
    position: absolute; bottom: 6px; left: 50%; width: 4px; height: 86px;
    background: var(--ink); border-radius: 3px; transform-origin: bottom center;
    margin-left: -2px; animation: metro 1.5s ease-in-out infinite;
  }
  .metro .arm::after { /* weight */
    content: ""; position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    width: 18px; height: 12px; border-radius: 3px; background: var(--lime);
  }
  .metro .pivot { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 14px; height: 14px; border-radius: 50%; background: var(--violet); }
  @keyframes metro { 0%,100% { transform: rotate(-30deg); } 50% { transform: rotate(30deg); } }

  /* ════════════════════════════════════════════════════════════════
     04 · WAVEFORM — traveling sine line (SVG path injected)
  ════════════════════════════════════════════════════════════════ */
  .wave { width: 120px; height: 90px; overflow: hidden; }
  .wave svg { display: block; width: 120px; height: 90px; }
  .wave .scroll { animation: waveScroll 1.6s linear infinite; }
  @keyframes waveScroll { from { transform: translateX(0); } to { transform: translateX(-60px); } }

  /* ════════════════════════════════════════════════════════════════
     05 · SOUND RIPPLES — expanding rings
  ════════════════════════════════════════════════════════════════ */
  .ripple { position: relative; width: 110px; height: 110px; }
  .ripple span { position: absolute; top: 50%; left: 50%; border: 2px solid var(--lime); border-radius: 50%;
    transform: translate(-50%,-50%); animation: ripple 2.1s cubic-bezier(.2,.6,.3,1) infinite; }
  .ripple span:nth-child(2) { animation-delay: .7s; }
  .ripple span:nth-child(3) { animation-delay: 1.4s; }
  .ripple .core { position: absolute; top: 50%; left: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px;
    background: var(--lime); border-radius: 50%; animation: corePulse 2.1s ease-in-out infinite; }
  @keyframes ripple { 0% { width: 10px; height: 10px; opacity: 1; } 100% { width: 108px; height: 108px; opacity: 0; } }
  @keyframes corePulse { 0%,100% { transform: scale(.7); } 50% { transform: scale(1); } }

  /* ════════════════════════════════════════════════════════════════
     06 · SPOTLIGHT — sweeping cone of light
  ════════════════════════════════════════════════════════════════ */
  .spot { position: relative; width: 120px; height: 116px; }
  .spot .src { position: absolute; top: 2px; left: 50%; transform: translateX(-50%); width: 14px; height: 14px; border-radius: 50%; background: var(--lime); z-index: 2; }
  .spot .beam {
    position: absolute; top: 9px; left: 50%; width: 90px; height: 104px; margin-left: -45px;
    background: linear-gradient(to bottom, rgba(199,248,7,.42), rgba(199,248,7,0) 82%);
    clip-path: polygon(50% 0, 78% 100%, 22% 100%);
    transform-origin: 50% 0; animation: spot 2.6s ease-in-out infinite;
  }
  @keyframes spot { 0%,100% { transform: rotate(-26deg); } 50% { transform: rotate(26deg); } }

  /* ════════════════════════════════════════════════════════════════
     07 · BOUNCING NOTE — ball with squash + shadow
  ════════════════════════════════════════════════════════════════ */
  .bounce { position: relative; width: 90px; height: 104px; }
  .bounce .ball { position: absolute; top: 0; left: 50%; width: 26px; height: 26px; margin-left: -13px;
    background: var(--lime); border-radius: 50%; animation: bounce 1s cubic-bezier(.5,0,.5,1) infinite; }
  .bounce .sh { position: absolute; bottom: 4px; left: 50%; width: 30px; height: 8px; margin-left: -15px;
    background: rgba(199,248,7,.18); border-radius: 50%; filter: blur(1px); animation: bshadow 1s cubic-bezier(.5,0,.5,1) infinite; }
  @keyframes bounce {
    0%   { transform: translateY(0) scaleY(1); }
    45%  { transform: translateY(70px) scaleY(1); }
    55%  { transform: translateY(74px) scaleY(.72); }
    65%  { transform: translateY(70px) scaleY(1); }
    100% { transform: translateY(0) scaleY(1); }
  }
  @keyframes bshadow { 0%,100% { transform: scale(.6); opacity: .35; } 55% { transform: scale(1); opacity: .9; } }

  /* ════════════════════════════════════════════════════════════════
     08 · VINYL — spinning record + tonearm
  ════════════════════════════════════════════════════════════════ */
  .vinyl { position: relative; width: 112px; height: 112px; }
  .vinyl .disc {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(closest-side, var(--lime) 0 14%, transparent 15%),
      repeating-radial-gradient(circle at 50% 50%, #1f231f 0 3px, #141714 3px 6px);
    border: 1px solid var(--line);
    animation: spinLin 2.4s linear infinite;
  }
  .vinyl .disc::after { content: ""; position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; background: var(--bg); border-radius: 50%; }
  .vinyl .arm {
    position: absolute; top: -4px; right: 2px; width: 4px; height: 64px; background: var(--ink);
    border-radius: 3px; transform-origin: top center; transform: rotate(22deg);
    animation: arm 2.4s ease-in-out infinite;
  }
  .vinyl .arm::after { content: ""; position: absolute; bottom: -3px; left: -3px; width: 10px; height: 7px; border-radius: 2px; background: var(--violet); }
  @keyframes arm { 0%,100% { transform: rotate(20deg); } 50% { transform: rotate(30deg); } }

  /* ════════════════════════════════════════════════════════════════
     09 · ORBIT — dots circling
  ════════════════════════════════════════════════════════════════ */
  .orbit { position: relative; width: 104px; height: 104px; animation: spinLin 1.8s linear infinite; }
  .orbit i { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; }
  .orbit i:nth-child(1) { background: var(--lime);   transform: rotate(0deg)   translateY(-44px); }
  .orbit i:nth-child(2) { background: var(--violet); transform: rotate(120deg) translateY(-44px); }
  .orbit i:nth-child(3) { background: var(--ink);    transform: rotate(240deg) translateY(-44px); width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; }

  /* ════════════════════════════════════════════════════════════════
     10 · BREATHE — pulsing core + halo ring
  ════════════════════════════════════════════════════════════════ */
  .breathe { position: relative; width: 100px; height: 100px; display: grid; place-items: center; }
  .breathe .ring { position: absolute; width: 92px; height: 92px; border: 2px solid var(--violet); border-radius: 50%; opacity: .5; animation: breRing 2s ease-in-out infinite; }
  .breathe .core { width: 44px; height: 44px; border-radius: 50%; background: var(--lime); animation: breCore 2s ease-in-out infinite; }
  @keyframes breCore { 0%,100% { transform: scale(.62); } 50% { transform: scale(1); } }
  @keyframes breRing { 0%,100% { transform: scale(.7); opacity: .65; } 50% { transform: scale(1); opacity: .15; } }

  /* ════════════════════════════════════════════════════════════════
     11 · BATON SPINNER — radial tapered dashes
  ════════════════════════════════════════════════════════════════ */
  .baton { position: relative; width: 100px; height: 100px; }
  .baton i { position: absolute; top: 50%; left: 50%; width: 5px; height: 17px; margin: -8.5px 0 0 -2.5px; border-radius: 3px; background: var(--lime);
    transform-origin: 50% 0; animation: batonFade 1.1s linear infinite; }
  @keyframes batonFade { 0% { opacity: 1; } 100% { opacity: .12; } }

  /* ════════════════════════════════════════════════════════════════
     12 · LOADING DOTS — scale in sequence
  ════════════════════════════════════════════════════════════════ */
  .dots3 { display: flex; gap: 14px; }
  .dots3 i { width: 18px; height: 18px; border-radius: 50%; background: var(--lime); animation: dot3 1.2s ease-in-out infinite; }
  .dots3 i:nth-child(2) { background: var(--violet); animation-delay: .18s; }
  .dots3 i:nth-child(3) { animation-delay: .36s; }
  @keyframes dot3 { 0%,100% { transform: scale(.4); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }

  /* ════════════════════════════════════════════════════════════════
     13 · FADERS — soundboard faders rising in sequence
  ════════════════════════════════════════════════════════════════ */
  .faders { display: flex; gap: 13px; height: 92px; align-items: stretch; }
  .faders .ch { position: relative; width: 4px; background: var(--line); border-radius: 3px; }
  .faders .knob { position: absolute; left: 50%; width: 16px; height: 9px; margin-left: -8px; border-radius: 3px; background: var(--lime); animation: fader 2s ease-in-out infinite; }
  .faders .ch:nth-child(2) .knob { background: var(--violet); animation-delay: -.5s; }
  .faders .ch:nth-child(3) .knob { animation-delay: -1s; }
  .faders .ch:nth-child(4) .knob { background: var(--violet); animation-delay: -1.5s; }
  @keyframes fader { 0%,100% { top: 4px; } 50% { top: calc(100% - 13px); } }

  /* ════════════════════════════════════════════════════════════════
     14 · PLAYHEAD — scrubber sweeping over static bars
  ════════════════════════════════════════════════════════════════ */
  .play { position: relative; width: 116px; height: 78px; display: flex; align-items: center; gap: 5px; }
  .play i { flex: 1; border-radius: 4px; background: rgba(244,245,242,0.16); }
  .play i:nth-child(1){height:30%}.play i:nth-child(2){height:62%}.play i:nth-child(3){height:88%}
  .play i:nth-child(4){height:48%}.play i:nth-child(5){height:74%}.play i:nth-child(6){height:36%}
  .play i:nth-child(7){height:66%}.play i:nth-child(8){height:52%}
  .play .head { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--lime); border-radius: 3px; box-shadow: 0 0 10px rgba(199,248,7,.7); animation: playhead 1.8s linear infinite; }
  @keyframes playhead { from { left: 0; } to { left: 100%; } }

  /* ════════════════════════════════════════════════════════════════
     15 · TUNING FORK — two prongs vibrating
  ════════════════════════════════════════════════════════════════ */
  .fork { position: relative; width: 70px; height: 100px; }
  .fork .stem { position: absolute; bottom: 0; left: 50%; width: 6px; height: 30px; margin-left: -3px; background: var(--ink); border-radius: 3px; }
  .fork .stem::after { content: ""; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); width: 14px; height: 14px; border-radius: 50%; background: var(--violet); }
  .fork .prong { position: absolute; top: 4px; width: 6px; height: 68px; background: var(--lime); border-radius: 4px 4px 0 0; }
  .fork .l { left: 18px; transform-origin: bottom center; animation: forkL .26s ease-in-out infinite; }
  .fork .r { right: 18px; transform-origin: bottom center; animation: forkR .26s ease-in-out infinite; }
  @keyframes forkL { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(0deg); } }
  @keyframes forkR { 0%,100% { transform: rotate(3deg); } 50% { transform: rotate(0deg); } }

  /* ════════════════════════════════════════════════════════════════
     16 · ARC — ring with a sweeping gap
  ════════════════════════════════════════════════════════════════ */
  .arc { width: 84px; height: 84px; border-radius: 50%; border: 6px solid rgba(244,245,242,0.10); border-top-color: var(--lime); border-right-color: var(--lime); animation: spinLin .9s linear infinite; }

  /* ════════════════════════════════════════════════════════════════
     17 · NOTE WAVE — row of dots, traveling vertical sine
  ════════════════════════════════════════════════════════════════ */
  .nwave { display: flex; align-items: center; gap: 9px; height: 90px; }
  .nwave i { width: 12px; height: 12px; border-radius: 50%; background: var(--lime); animation: nwave 1.1s ease-in-out infinite; }
  .nwave i:nth-child(1){animation-delay:0s}.nwave i:nth-child(2){animation-delay:.1s}
  .nwave i:nth-child(3){animation-delay:.2s}.nwave i:nth-child(4){animation-delay:.3s}
  .nwave i:nth-child(5){animation-delay:.4s}.nwave i:nth-child(6){animation-delay:.5s}
  @keyframes nwave { 0%,100% { transform: translateY(22px); } 50% { transform: translateY(-22px); } }

  /* ════════════════════════════════════════════════════════════════
     18 · DOT RING — dots around a circle lighting in sequence
  ════════════════════════════════════════════════════════════════ */
  .dotring { position: relative; width: 100px; height: 100px; }
  .dotring i { position: absolute; top: 50%; left: 50%; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: var(--lime); animation: dotring 1.2s linear infinite; }
  @keyframes dotring { 0% { opacity: 1; transform: var(--p) scale(1.25); } 100% { opacity: .15; transform: var(--p) scale(.85); } }

  /* ════════════════════════════════════════════════════════════════
     19 · COMET — conic gradient sweep
  ════════════════════════════════════════════════════════════════ */
  .comet { width: 90px; height: 90px; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(199,248,7,0) 0deg, rgba(199,248,7,.15) 200deg, var(--lime) 360deg);
    -webkit-mask: radial-gradient(farthest-side, transparent 58%, #000 60%);
            mask: radial-gradient(farthest-side, transparent 58%, #000 60%);
    animation: spinLin 1.1s linear infinite; }

  /* ════════════════════════════════════════════════════════════════
     20 · CYMBALS — two discs crashing (scale + overlap)
  ════════════════════════════════════════════════════════════════ */
  .cymbals { position: relative; width: 110px; height: 80px; }
  .cymbals i { position: absolute; top: 50%; width: 56px; height: 56px; margin-top: -28px; border-radius: 50%; }
  .cymbals .a { left: 4px;  background: var(--lime);   animation: cymA 1.3s ease-in-out infinite; }
  .cymbals .b { right: 4px; background: var(--violet); animation: cymB 1.3s ease-in-out infinite; mix-blend-mode: screen; }
  @keyframes cymA { 0%,100% { transform: translateX(-14px) scale(.9); } 45% { transform: translateX(16px) scale(1.04); } 55% { transform: translateX(16px) scale(1.04); } }
  @keyframes cymB { 0%,100% { transform: translateX(14px) scale(.9); }  45% { transform: translateX(-16px) scale(1.04); } 55% { transform: translateX(-16px) scale(1.04); } }

  @keyframes spinLin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <header>
    <div class="wordmark">Orkestra<span class="dot">.</span></div>
    <div class="caption">Loading States · 20</div>
  </header>

  <main class="grid">
    <div class="tile"><div class="stage"><div class="eq"><i></i><i></i><i></i><i></i><i></i></div></div></div>

    <div class="tile"><div class="stage"><div class="curtain"><div class="rod"></div><div class="glow"></div><div class="panel left"></div><div class="panel right"></div></div></div></div>

    <div class="tile"><div class="stage"><div class="metro"><div class="arm"></div><div class="pivot"></div></div></div></div>

    <div class="tile"><div class="stage"><div class="wave"></div></div></div>

    <div class="tile"><div class="stage"><div class="ripple"><span></span><span></span><span></span><div class="core"></div></div></div></div>

    <div class="tile"><div class="stage"><div class="spot"><div class="src"></div><div class="beam"></div></div></div></div>

    <div class="tile"><div class="stage"><div class="bounce"><div class="sh"></div><div class="ball"></div></div></div></div>

    <div class="tile"><div class="stage"><div class="vinyl"><div class="disc"></div><div class="arm"></div></div></div></div>

    <div class="tile"><div class="stage"><div class="orbit"><i></i><i></i><i></i></div></div></div>

    <div class="tile"><div class="stage"><div class="breathe"><div class="ring"></div><div class="core"></div></div></div></div>

    <div class="tile"><div class="stage"><div class="baton"></div></div></div>

    <div class="tile"><div class="stage"><div class="dots3"><i></i><i></i><i></i></div></div></div>

    <div class="tile"><div class="stage"><div class="faders"><div class="ch"><div class="knob"></div></div><div class="ch"><div class="knob"></div></div><div class="ch"><div class="knob"></div></div><div class="ch"><div class="knob"></div></div></div></div></div>

    <div class="tile"><div class="stage"><div class="play"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><div class="head"></div></div></div></div>

    <div class="tile"><div class="stage"><div class="fork"><div class="prong l"></div><div class="prong r"></div><div class="stem"></div></div></div></div>

    <div class="tile"><div class="stage"><div class="arc"></div></div></div>

    <div class="tile"><div class="stage"><div class="nwave"><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div>

    <div class="tile"><div class="stage"><div class="dotring"></div></div></div>

    <div class="tile"><div class="stage"><div class="comet"></div></div></div>

    <div class="tile"><div class="stage"><div class="cymbals"><i class="a"></i><i class="b"></i></div></div></div>
  </main>

<script>
  // ── Waveform (#04): build a seamless traveling sine path ──────────
  (function () {
    const W = 120, H = 90, mid = H / 2, amp = 26, period = 60;
    // draw across 2× width so translateX(-60) loops seamlessly
    const total = W + period, step = 4;
    let d = "M 0 " + (mid - amp * Math.sin(0));
    for (let x = step; x <= total; x += step) {
      const y = mid - amp * Math.sin((x / period) * Math.PI * 2);
      d += " L " + x + " " + y.toFixed(2);
    }
    const ns = "http://www.w3.org/2000/svg";
    document.querySelectorAll(".wave").forEach(function (host) {
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("viewBox", "0 0 " + W + " " + H);
      const g = document.createElementNS(ns, "g");
      g.setAttribute("class", "scroll");
      const p = document.createElementNS(ns, "path");
      p.setAttribute("d", d);
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", "#C7F807");
      p.setAttribute("stroke-width", "5");
      p.setAttribute("stroke-linecap", "round");
      p.setAttribute("stroke-linejoin", "round");
      g.appendChild(p);
      svg.appendChild(g);
      host.appendChild(svg);
    });
  })();

  // ── Baton (#11): place 12 radial dashes around center ─────────────
  (function () {
    const baton = document.querySelector(".baton");
    const N = 12, dur = 1.1;
    for (let i = 0; i < N; i++) {
      const el = document.createElement("i");
      el.style.transform = "rotate(" + (i * 360 / N) + "deg) translateY(34px)";
      el.style.animationDelay = (-(dur / N) * (N - i)).toFixed(3) + "s";
      baton.appendChild(el);
    }
  })();

  // ── Dot ring (#18): place 12 dots around a circle ─────────────────
  (function () {
    const ring = document.querySelector(".dotring");
    const N = 12, dur = 1.2, R = 42;
    for (let i = 0; i < N; i++) {
      const el = document.createElement("i");
      const p = "rotate(" + (i * 360 / N) + "deg) translateY(-" + R + "px)";
      el.style.setProperty("--p", p);
      el.style.transform = p;
      el.style.animationDelay = (-(dur / N) * (N - i)).toFixed(3) + "s";
      ring.appendChild(el);
    }
  })();
</script>
</body>
</html>
